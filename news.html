<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News — Legit Fuoye</title>
  <link rel="icon" href="logo/logo.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a class="nav-brand" href="index.html">
      <img src="logo/logo.jpg" alt="Logo"><span>Legit Fuoye</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="news.html" class="active">News</a></li>
      <li><a href="community.html">Community</a></li>
      <li><a href="cbt.html">CBT</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li id="nav-auth"><a href="login.html" class="btn-green" style="padding:7px 16px">Login</a></li>
    </ul>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>📰 Campus News</h1>
    </div>
    <div id="news-list">
      <div class="card loading-block"><span class="spinner spinner-dark"></span> Loading…</div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 <strong>FUOYE Gist</strong>. Built for excellence.</p>
    <p>Federal University Oye-Ekiti, Ekiti State, Nigeria</p>
    <p><a href="contact.html">📞 Contact Us</a></p>
  </footer>

  <script type="module">
    import { supabase } from './js/supabase-client.js';
    import { escapeHtml, timeAgo } from './js/main.js';

    // Update nav if logged in
    try {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        const { data: p } = await supabase.from('profiles').select('role').eq('id', user.id).single();
        const dash = p?.role === 'admin' ? 'admin.html' : 'user.html';
        document.getElementById('nav-auth').innerHTML =
          `<a href="${dash}" class="btn-green" style="padding:7px 16px">Dashboard</a>`;
      }
    } catch (_) {}

    const { data: { session } } = await supabase.auth.getSession();
    const query = supabase.from('news').select('*').order('created_at', { ascending: false });
    if (!session) query.eq('visibility', 'public');

    const { data: news, error } = await query;
    const box = document.getElementById('news-list');

    if (error) {
      box.innerHTML = `<div class="alert alert-error">${escapeHtml(error.message)}</div>`;
    } else if (!news?.length) {
      box.innerHTML = `<div class="card"><div class="empty"><h3>No news yet</h3><p>Check back soon.</p></div></div>`;
    } else {
      box.innerHTML = news.map(n => `
        <article class="card">
          <div class="card-meta">
            <span class="status-pill ${n.visibility==='public'?'status-active':'status-admin'}">${n.visibility}</span>
            <span>🕒 ${timeAgo(n.created_at)}</span>
          </div>
          <h3 class="mt-1">${escapeHtml(n.title)}</h3>
          <p>${escapeHtml(n.content).replace(/\n/g, '<br>')}</p>
          ${n.media_url ? (n.media_url.match(/\.(mp4|webm|mov)$/i)
            ? `<video src="${escapeHtml(n.media_url)}" controls preload="metadata"></video>`
            : `<img src="${escapeHtml(n.media_url)}" alt="" loading="lazy">`) : ''}
        </article>
      `).join('');
    }
  </script>
</body>
</html>
